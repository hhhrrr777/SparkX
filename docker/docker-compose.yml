version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sparkx-postgres
    environment:
      POSTGRES_USER: sparkai
      POSTGRES_PASSWORD: 123123
      POSTGRES_DB: sparkai
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkai -d sparkai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sparkx-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sparkai
      SPRING_DATASOURCE_USERNAME: sparkai
      SPRING_DATASOURCE_PASSWORD: 123123
    ports:
      - "8989:8989"

  frontend:
    build: ./frontend
    container_name: sparkx-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg-data:
